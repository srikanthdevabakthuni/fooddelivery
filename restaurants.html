<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .resto-grid-card {
      background: #fff;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      height: 100%;
      cursor: pointer;
    }
    .resto-grid-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-hover); }

    .resto-grid-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .resto-grid-body { padding: 20px; }
    .resto-grid-body h5 { font-size: 20px; margin-bottom: 6px; }

    .resto-grid-meta {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
      margin: 10px 0;
    }
    .resto-grid-meta span { display: flex; align-items: center; gap: 5px; }

    .resto-grid-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .resto-grid-tag {
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
    }

    .resto-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .resto-status-badge.open  { background: #dcfce7; color: #16a34a; }
    .resto-status-badge.closed { background: #fee2e2; color: #dc2626; }

    .resto-offer-tag {
      display: inline-block;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .filter-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }
    .filter-chip {
      padding: 8px 20px;
      border-radius: 50px;
      border: 2px solid #e5e7eb;
      background: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-chip:hover, .filter-chip.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .city-selector {
      padding: 10px 18px;
      border: 2px solid #e5e7eb;
      border-radius: 50px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      background: #fff;
      transition: var(--transition);
    }
    .city-selector:focus { border-color: var(--primary); }

    .resto-search {
      position: relative;
      max-width: 380px;
    }
    .resto-search input {
      width: 100%;
      padding: 11px 16px 11px 42px;
      border: 2px solid #e5e7eb;
      border-radius: 50px;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .resto-search input:focus { border-color: var(--primary); }
    .resto-search i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }

    .sort-select {
      padding: 10px 18px;
      border: 2px solid #e5e7eb;
      border-radius: 50px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
      background: #fff;
      transition: var(--transition);
    }
    .sort-select:focus { border-color: var(--primary); }

    .min-order-tag {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    .resto-footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #f3f4f6;
    }
    .btn-order-now {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }
    .btn-order-now:hover { background: var(--primary-dark); color: #fff; transform: translateY(-1px); }

    .resto-count { font-size: 14px; color: var(--muted); margin-bottom: 20px; }

    #noResults { display: none; text-align: center; padding: 60px 20px; }
    #noResults .emoji { font-size: 60px; margin-bottom: 16px; }
  </style>

let activeFilter = 'all';
let activeCity = 'all';
let activeSort = 'default';
let searchTerm = '';

function renderRestaurants() {
  let list = [...RESTAURANTS];

  // Search
  if (searchTerm) {
    list = list.filter(r =>
      r.name.toLowerCase().includes(searchTerm) ||
      r.tags.some(t => t.toLowerCase().includes(searchTerm)) ||
      r.desc.toLowerCase().includes(searchTerm)
    );
  }

  // City filter
  if (activeCity !== 'all') {
    list = list.filter(r => r.city === activeCity);
  }

  // Chip filter
  if (activeFilter !== 'all') {
    if (activeFilter === 'open') list = list.filter(r => r.status === 'open');
    else if (activeFilter === 'free-delivery') list = list.filter(r => r.deliveryFree);
    else list = list.filter(r => r.filters.includes(activeFilter));
  }

  // Sort
  if (activeSort === 'rating') list.sort((a, b) => b.rating - a.rating);
  else if (activeSort === 'delivery') list.sort((a, b) => a.timeMin - b.timeMin);
  else if (activeSort === 'minorder') list.sort((a, b) => a.minOrder - b.minOrder);

  const grid = document.getElementById('restoGrid');
  const noRes = document.getElementById('noResults');
  const count = document.getElementById('restoCount');

  if (list.length === 0) {
    grid.innerHTML = '';
    noRes.style.display = 'block';
    count.textContent = 'No restaurants found';
    return;
  }

  noRes.style.display = 'none';
  count.textContent = `Showing ${list.length} restaurant${list.length !== 1 ? 's' : ''}`;

  grid.innerHTML = list.map(r => `
    <div class="col-md-6 col-lg-4 fade-in">
      <div class="resto-grid-card">
        <div style="position:relative;">
          <img class="resto-grid-img" src="${r.img}" alt="${r.name}" loading="lazy"/>
          <span class="resto-status ${r.status}" style="position:absolute;top:14px;right:14px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background:${r.status==='open'?'#dcfce7':'#fee2e2'};color:${r.status==='open'?'#16a34a':'#dc2626'};">
            ${r.status === 'open' ? '🟢 Open' : '🔴 Closed'}
          </span>
        </div>
        <div class="resto-grid-body">
          ${r.offer ? `<span class="resto-offer-tag">🏷️ ${r.offer}</span>` : ''}
          <h5>${r.name}</h5>
          <div style="font-size:14px;color:var(--muted);margin-bottom:4px;">${r.desc}</div>
          <div class="food-rating" style="font-size:14px; margin:8px 0;">
            ⭐ ${r.rating} <span class="text-muted fw-normal">(${r.reviews.toLocaleString()} reviews)</span>
          </div>
          <div class="resto-grid-meta">
            <span><i class="fa-solid fa-motorcycle" style="color:var(--primary);"></i> ${r.delivery}</span>
            <span><i class="fa-regular fa-clock" style="color:var(--primary);"></i> ${r.time}</span>
          </div>
          <div class="resto-grid-tags">
            ${r.tags.map(t => `<span class="resto-grid-tag">${t}</span>`).join('')}
          </div>
          <div class="resto-footer-bar">
            <span class="min-order-tag">Min order: ₹${r.minOrder}</span>
            <a href="menu.html" class="btn-order-now">Order Now</a>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  // Trigger fade-in
  setTimeout(() => {
    document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible'));
  }, 50);
}

function resetAll() {
  activeFilter = 'all';
  activeCity = 'all';
  activeSort = 'default';
  searchTerm = '';
  document.getElementById('restoSearch').value = '';
  document.getElementById('cityFilter').value = 'all';
  document.getElementById('restoSort').value = 'default';
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === 'all'));
  renderRestaurants();
}

// Filter chips
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.filter;
    renderRestaurants();
  });
});

// Search
document.getElementById('restoSearch').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  renderRestaurants();
});

// City
document.getElementById('cityFilter').addEventListener('change', e => {
  activeCity = e.target.value;
  renderRestaurants();
});

// Sort
document.getElementById('restoSort').addEventListener('change', e => {
  activeSort = e.target.value;
  renderRestaurants();
});

renderRestaurants();
</script>
