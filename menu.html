<!-- FILTER BAR -->

const menuGrid = document.getElementById('menuGrid');
const emptyDiv = document.getElementById('emptyState');
const infoDiv  = document.getElementById('resultsInfo');
let activeCategory = 'all';

function renderCards(items) {
  menuGrid.innerHTML = '';
  if (items.length === 0) { emptyDiv.classList.remove('d-none'); infoDiv.textContent = ''; return; }
  emptyDiv.classList.add('d-none');
  infoDiv.textContent = `Showing ${items.length} item${items.length !== 1 ? 's' : ''}`;

  items.forEach(item => {
    const col = document.createElement('div');
    col.className = 'col-md-6 col-lg-4 fade-in';
    col.innerHTML = `
      <div class="food-card">
        <div class="food-img-wrap">
          <img src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x260?text=Food'"/>
          ${item.badge ? `<span class="food-badge" style="background:${item.badgeColor}">${item.badge}</span>` : ''}
          <button class="food-fav" title="Favourite"><i class="fa-regular fa-heart"></i></button>
        </div>
        <div class="food-body">
          <div class="food-meta">
            <span class="food-rating">⭐ ${item.rating}</span>
            <span class="food-time"><i class="fa-regular fa-clock me-1"></i>${item.time}</span>
          </div>
          <h5>${item.name}</h5>
          <p>${item.desc}</p>
          <div class="food-footer">
            <span class="food-price">₹${item.price}</span>
            <button class="btn-add" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}" data-img="${item.img}">+</button>
          </div>
        </div>
      </div>`;
    menuGrid.appendChild(col);
  });

  menuGrid.querySelectorAll('.btn-add').forEach(btn => {
    btn.addEventListener('click', () => {
      FoodHub.addToCart({ id: btn.dataset.id, name: btn.dataset.name, price: parseFloat(btn.dataset.price), img: btn.dataset.img });
      btn.textContent = '✓'; btn.classList.add('added');
      setTimeout(() => { btn.textContent = '+'; btn.classList.remove('added'); }, 1200);
    });
  });

  menuGrid.querySelectorAll('.food-fav').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('liked');
      btn.innerHTML = btn.classList.contains('liked') ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';
    });
  });

  setTimeout(() => document.querySelectorAll('.fade-in').forEach(el => el.classList.add('visible')), 50);
}

function applyFilters() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const cat    = document.getElementById('catFilter').value;
  const sort   = document.getElementById('sortFilter').value;
  const price  = document.getElementById('priceFilter').value;

  let results = MENU.filter(item => {
    const matchCat    = cat === 'all' || item.cat === cat;
    const matchAct    = activeCategory === 'all' || item.cat === activeCategory;
    const matchSearch = item.name.toLowerCase().includes(search) || item.desc.toLowerCase().includes(search);
    const matchPrice  = price === 'all'
      || (price === 'budget'  && item.price < 150)
      || (price === 'mid'     && item.price >= 150 && item.price <= 350)
      || (price === 'premium' && item.price > 350);
    return matchCat && matchAct && matchSearch && matchPrice;
  });

  if (sort === 'price-asc')  results.sort((a, b) => a.price - b.price);
  if (sort === 'price-desc') results.sort((a, b) => b.price - a.price);
  if (sort === 'rating')     results.sort((a, b) => b.rating - a.rating);

  renderCards(results);
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('catFilter').value = 'all';
  document.getElementById('sortFilter').value = 'default';
  document.getElementById('priceFilter').value = 'all';
  activeCategory = 'all';
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.toggle('active', p.dataset.cat === 'all'));
  applyFilters();
}

document.querySelectorAll('.cat-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    activeCategory = pill.dataset.cat;
    document.getElementById('catFilter').value = activeCategory;
    applyFilters();
  });
});

['searchInput', 'catFilter', 'sortFilter', 'priceFilter'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', applyFilters);
});

const urlCat = new URLSearchParams(location.search).get('cat');
if (urlCat) {
  activeCategory = urlCat;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.toggle('active', p.dataset.cat === urlCat));
  document.getElementById('catFilter').value = urlCat;
}

applyFilters();
</script>
